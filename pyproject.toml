[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vb-ege-synthetic"
version = "0.2.0"
description = "Synthetic experiments for Beyond Scalar Leaderboards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "matplotlib>=3.8,<4",
  "pyyaml>=6,<7",
  "tqdm>=4.66,<5",
  "pyarrow>=16,<23",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["vb_ege*", "icml_pareto_track_stop*", "pilot_focal_bt_mle*"]
exclude = [
  "icml_pareto_track_stop.results*",
  "pilot_focal_bt_mle.results*",
  "pilot_focal_bt_mle.report*",
]

[tool.setuptools.package-data]
icml_pareto_track_stop = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
